name: CI

on:
  push:
    branches: [mainline, master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (native)
        run: cargo clippy --all-targets

      - name: Clippy (web/wasm)
        run: cargo clippy --no-default-features --features web --target wasm32-unknown-unknown

      - name: Unit tests
        run: cargo test --lib

      - name: Web build (wasm32)
        run: cargo build --no-default-features --features web --target wasm32-unknown-unknown
